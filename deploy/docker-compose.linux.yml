# ============================================================
#  Docker Compose — Linux 独立部署配置
#  用法: docker compose -f deploy/docker-compose.linux.yml up -d --build
#
#  此文件是完全独立的，无需与 docker-compose.yml 合并使用。
#  所有服务使用 host 网络模式，nmap/iperf3 直接访问物理网卡。
#
#  注意:
#    - 确保宿主机 80（Nginx）、6379（Redis）、8000（后端）端口未被占用
#    - Redis 连接使用 127.0.0.1（host 网络模式下直接使用宿主机网络栈）
# ============================================================

services:
  # Redis — 消息队列 & 结果后端
  redis:
    image: redis:7-alpine
    container_name: ops_redis
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis_data:/data

  # FastAPI 后端
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ops_backend
    restart: unless-stopped
    network_mode: host
    # WireGuard peer 管理需要 NET_ADMIN 权限（host 网络模式下操作宿主机 wg0 接口）
    cap_add:
      - NET_ADMIN
    env_file:
      - ../backend/.env
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    volumes:
      - ../backend:/app
      - db_data:/app/data
    depends_on:
      - redis

  # Celery Worker — 执行定时/异步任务（扫描测速已由探针执行）
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ops_celery
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../backend/.env
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    command: celery -A app.tasks.worker worker --loglevel=info --concurrency=4 -Q default,topology,inspection,config_backup,commands,ipam
    volumes:
      - ../backend:/app
      - db_data:/app/data
    depends_on:
      - redis
      - backend

  # Celery Beat — 定时任务（可选）
  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ops_celery_beat
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../backend/.env
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    command: celery -A app.tasks.worker beat --loglevel=info
    volumes:
      - ../backend:/app
    depends_on:
      - redis

  # Nginx — 反向代理 & 前端静态文件托管（多阶段构建前端）
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    container_name: ops_nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.linux.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # iperf3 服务端 — 中心节点，供探针测速（监听 5201，VPN 隧道 IP 可达）
  # 注意: 必须前台运行（不带 -D）；-D 守护模式会 fork 后主进程退出，
  # 导致 PID 1 退出、容器无限重启（曾累计重启 1.8 万次）
  iperf3_server:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ops_iperf3
    restart: unless-stopped
    network_mode: host
    command: ["iperf3", "-s"]
    depends_on:
      - backend

volumes:
  redis_data:
  db_data:
